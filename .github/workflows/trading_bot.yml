name: TradingBot — Trading 212

on:
  push:
    branches:
      - claude/telegram-investbot-zJXWJ
    paths:
      - '.github/workflows/trading_bot.yml'
  schedule:
    # Toutes les 5 min, 13h05-21h05 UTC = 9h05-17h05 ET (couvre NYSE 9h30-16h)
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code et de l'état
        uses: actions/checkout@v4
        with:
          ref: claude/telegram-investbot-zJXWJ

      - name: Installation Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Exécution de la stratégie
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          T212_DEMO: ${{ secrets.T212_DEMO || 'true' }}
          STOP_LOSS_PCT: '0.03'
          MAX_POSITION_PCT: '0.20'
          DAILY_LOSS_LIMIT_PCT: '0.05'
          DEBUG: 'false'
        run: python run_once.py

      - name: Sauvegarde de l'état (trades, PnL)
        run: |
          git config user.email "trading-bot@users.noreply.github.com"
          git config user.name "InvestBot"
          git pull --rebase origin claude/telegram-investbot-zJXWJ
          # Valider les JSON avant commit — ne pas persister un état corrompu
          for f in trades.json daily_pnl.json disabled_assets.json positions_meta.json risk_stats.json bot_control.json; do
            if [ -f "$f" ]; then
              python -m json.tool "$f" > /dev/null 2>&1 || { echo "ERREUR: $f est corrompu, commit annulé"; exit 1; }
            fi
          done
          git add trades.json daily_pnl.json disabled_assets.json positions_meta.json risk_stats.json bot_control.json decisions.log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "bot: mise à jour état [skip ci]"
          git push origin claude/telegram-investbot-zJXWJ
